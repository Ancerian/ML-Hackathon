[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tokamld"
version = "0.1.0"
description = "Differentiable PyTorch tools for Tokamak Equilibrium, Grad-Shafranov Residuals, Topology and Conformal UQ"
readme = "README.md"
authors = [
    { name = "Hackathon FMF Team", email = "hackathon.fmf@kpi.ua" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
