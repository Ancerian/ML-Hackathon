function tick(now){let dt=(now-last)/1000;last=now;if(playing){if(mode==='film'){elapsed+=dt;if(elapsed>(short?shortTotal:total)){elapsed=0;playing=false}}else{let s=S[scene],limit=s.b[beat+1]??s.d;elapsed+=dt;if(elapsed>=limit){elapsed=limit;playing=false}}}let T=mode==='film'?timeline(elapsed):{i:scene,local:elapsed,scene:S[scene]};scene=T.i;draw(T);requestAnimationFrame(tick)}requestAnimationFrame(tick);
function setScene(i){scene=clamp(i,0,9);beat=0;elapsed=0;playing=false;sync()}
function next(){let s=S[scene];if(beat<s.b.length-1){beat++;playing=true}else if(scene<9){scene++;beat=0;elapsed=0;playing=true}sync()}
function prev(){let s=S[scene];if(elapsed>s.b[beat]+.25){elapsed=s.b[beat]}else if(beat){beat--;elapsed=s.b[beat]}else if(scene){scene--;beat=S[scene].b.length-1;elapsed=S[scene].b[beat]}playing=false;sync()}

function openNotes(){notes=window.open('','motion-opus-notes','width=620,height=720');if(!notes)return;notes.document.write('<!doctype html><title>Motion Opus notes</title><style>body{margin:30px;background:#04060B;color:#F2F5FA;font:20px Arial}#clock{font:64px ui-monospace;color:#7DF9FF}small{color:#8A94A8}</style><div id=clock>12:00</div><h2 id=where></h2><p id=current></p><hr><small>Наступний біт</small><p id=next></p><script>const c=new BroadcastChannel("motion-opus"),s=["Відкрити питання точності.","Показати рівновагу як форму.","Пояснити GS як обмеження.","Порівняти окремий 2D кадр.","Пояснити шлюз організаторів.","Прочитати CI, не ранг.","Зв’язати q з резонансом.","Показати острів і обережність.","Назвати спростування результатом.","Замкнути три тези."];let t=0;c.onmessage=e=>{let d=e.data;where.textContent="S"+d.scene+" · біт "+(d.beat+1);current.textContent=s[d.scene];next.textContent=s[Math.min(9,d.scene+1)]};setInterval(()=>{t++;let r=720-t,m=Math.floor(Math.abs(r)/60)+":"+("0"+Math.abs(r)%60).slice(-2);clock.textContent=(r<0?"+":"")+m;clock.style.color=r>120?"#7DF9FF":r>=0?"#FFB347":"#FF6B4A"},1000)<\/script>');notes.document.close();sync()}
})();
