# JET as built, 1983 (first plasma 25.06.1983, limiter era) - DELTA file on top of machines/jet1975/dimensions.yaml
# User decision G1 (2026-09-29): 1975 design = reference; 1983 = documented deltas; every assumption flagged.
#
# Path convention for overrides: "<section>.<id>" = the list entry with that `id` in that top-level section of
#   jet1975/dimensions.yaml; only its `value` (and unit/source/page/confidence/note) is replaced.
# components_remove: "<section>" (whole section), "<section>.<id>" (one entry) or "profiles/<file>.csv" (a base profile).
# components_add: new objects; `params` lengths in m, angles in deg, masses in kg unless the key says otherwise.
#   `assumed_params` inside params lists the keys that are OUR assumptions (no source value).
# page = PDF page number (not the printed page) of the file in library/.  Printed page = PDF-8 (1983 PR),
#   PDF-2 (Brochure), PDF-12 (1979 AR), PDF-10 (Wesson).
# confidence: text | table | drawing | digitized | assumed  (same meaning as in jet1975/dimensions.yaml)
# Sources (facts/dimensions only, no figure reproduced; (c) ECSC/EEC/EURATOM; Wesson: reproduction restricted):
#   JET_JU_1983_Progress_Report.pdf  EUR 9472 EN (EUR-JET-PR1), 1984
#   JET_JU_Brochure.pdf              EUR 8306 EN (EUR-JET-RI 1), Nov. 1982
#   JET_JU_1979_Annual_Report.pdf    EUR-6832 EN (EUR-JET-AR2), 1980
#   JET_Wesson_1999_Science_of_JET.pdf  JET-R(99)13, 1999
#   JET_1975_Design_Proposal_EUR5516e.pdf (base document; used once for a digitized bellows length)
#
# CONFIRMED UNCHANGED (checked, no override needed - see README):
#   plasma R0 2.96, a 1.25, b 2.10, R0/a 2.37, b/a 1.68 (1983 PR p.13; Brochure p.6; 1979 p.15)
#   TF: 32 coils, 24 turns, Cu 3900 mm2, 12 t/coil, 384 t, overall 5.68 m x 3.86 m, 53/66 kA (Brochure p.13-14)
#   vessel: 2.63 m / 4.18 m diameters, wall 18 cm, 190 m3, bellows Inconel 625 (Brochure p.13)
#   vessel inner dims "4.3 m vertically x 2.7 m horizontal inner diameter" (1983 PR p.23) = rigid-sector
#     plasma-side wall of the 1975 drawn profile (2*2.135 = 4.270; 4.389-1.664 = 2.725) -> profile NOT overridden
#   "2.5 m wide by 4.2 m high" (1983 PR p.12; Brochure p.6) = plasma 2a x 2b, not a vessel dimension
#   PF outer diameters 2 / 5 / 8 / 11 m (Brochure p.15) = 1975 values rounded to whole metres

base: jet1975
variant: "JET as built, 1983 (first plasma, limiter era)"

overrides:
  # ---------------- vacuum vessel ----------------
  - {path: "vessel.n_rigid_sectors", value: 40, unit: "count", source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "Each octant consists of five rigid sectors and four bellows assemblies -> 8 x 5 = 40 rigid PIECES (1975: 32). Same statement: Brochure p.12 (five rigid pieces and four sets of bellows); 1979 AR p.36 (all five of the rigid sectors for the prototype octant). Bellows total stays 8 x 4 = 32. Geometric interpretation (assumed): the 1975 octant was cut in the middle of its outermost rigid sectors (1975 p.299); in 1983 these two half-sectors are separate end pieces, so the 40 pieces still fill 32 pitches of 11.25 deg - see components_add vessel_octant_layout_1983. Three different rigid-sector types were made (1983 PR p.24)."}
  - {path: "vessel.n_octants", value: 8, unit: "count", source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "Value unchanged; composition changed: octant = 5 rigid sectors + 4 bellows assemblies (1975: 4 + 4). Octants joined by renewable Inconel lip welds (p.24; p.17)."}
  - {path: "vessel.bellows_wall_thickness", value: 0.002, unit: "m", source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "Bellows fabricated from Inconel 625 sheets of 2 mm thickness (1975 stress calc: 1.7 mm). 1979 AR p.36: dimensional changes to the bellows for wider manufacturing tolerances."}
  - {path: "vessel.total_weight", value: 108000.0, unit: "kg", source: "JET_JU_1983_Progress_Report.pdf", page: 13, confidence: table, note: "Table I: weight of vacuum vessel 108 t (1975: 68 t). Same 108 t in 1979 AR Table I p.15. CONTRADICTION: Brochure 1982 gives 100 t (p.6 table and p.13 vessel table). 108 t chosen as the later as-built report."}
  - {path: "vessel.octant_weight", value: 13500.0, unit: "kg", source: "JET_JU_1983_Progress_Report.pdf", page: 13, confidence: table, note: "DERIVED 108 t / 8 = 13.5 t (not printed); with the Brochure 100 t it would be 12.5 t."}
  - {path: "vessel.resistance_toroidal", value: 6.0e-4, unit: "ohm", source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "overall vessel resistance 0.6 mOhm (1975 table: 0.52 mOhm); high-resistivity Inconel 625 bellows chosen for this."}
  - {path: "vessel.material_rigid_sectors", value: "Nicrofer 7216 LC (vacuum melted, equivalent to Inconel 600)", unit: "-", source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "1975: Inconel 600 / Nicrofer 7216. Bellows remain Inconel 625 (p.24; Brochure p.13). Bellows flanges: 4 mm Nicrofer 7216 LC plates."}
  - {path: "vessel.base_pressure", value: 1.0e-10, unit: "Torr", source: "JET_JU_Brochure.pdf", page: 12, confidence: text, note: "base pressure of 10^-10 torr required (1975: about 2 x 10^-10 Torr). A requirement, not a measured value; 1983 PR p.24 gives outgassing 10^-11 mbar l s^-1 cm^-2 instead."}
  - {path: "vessel.thermal_insulation", value: 0.025, unit: "m", source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: assumed, note: "Material changed: Microtherm insulation panels in two overlapping layers (1975: Triton Kaowool 2.5 cm). Thickness NOT stated in 1983 sources -> 1975 value 0.025 m kept as ASSUMPTION."}
  # ---------------- limiters ----------------
  - {path: "limiters.outer_limiter_R", value: 4.21, unit: "m", source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: assumed, note: "Now = front face of the 4 graphite limiter modules at the outer midplane, adjustable in the radial direction (p.24); the radius is NOT given in 1983 sources -> 1975 Re(plasma) 4.21 kept as ASSUMPTION. NB 1983 plasmas had radius ~1.1 m (p.13), so the real 1983 limiter setting may have been nearer ~4.1 m."}
  # ---------------- PF coils ----------------
  - {path: "pf_coils.coil1_count", value: 8, unit: "count", source: "JET_JU_Brochure.pdf", page: 15, confidence: table, note: "Table: Coil No.1 number of coils 8; text: The 8, essentially identical, inner coils (1975: 10). Also 8 blocks drawn in the coil-1 stack of 1979 AR Fig.12 p.33."}
  - {path: "pf_coils.n_pf_coils_total", value: 14, unit: "count", source: "JET_JU_Brochure.pdf", page: 15, confidence: table, note: "DERIVED 8 + 2 + 2 + 2 = 14 (1975: 16). Text p.15: six larger diameter outer coils; Wesson p.41: inner coil + six other coils."}
  - {path: "pf_coils.coil1_pitch_height", value: 0.533, unit: "m", source: "JET_JU_1979_Annual_Report.pdf", page: 33, confidence: digitized, note: "1979 Fig.12 (layout of PF system, no printed dims): 8-coil stack spans 4.26 m (+-0.2), centred on the midplane; vertical scale calibrated on upper-arm top to lower-arm bottom = 11.42 m (base iron_core Z 5.79 / -5.63), midplane check within 0.05 m; horizontal scale of that figure is NOT consistent (schematic) -> vertical only. 4.26/8 = 0.533 m per coil (1975: 0.497 x 10 = 4.97 m). Per-coil turns/section for the 8-coil design NOT known."}
  - {path: "pf_coils.coil1_max_current_per_conductor", value: 40000.0, unit: "A", source: "JET_JU_Brochure.pdf", page: 15, confidence: table, note: "Coil No.1 maximum current 40,000 A (1975: 34 kA); coils 2-4: 45,000 A each (1975: 34 / 11.8 / 13 kA) - winding designs of coils 2-4 therefore probably changed too, but turns are not given (not overridden)."}
  # ---------------- iron core ----------------
  - {path: "iron_core.mass_total", value: 2800000.0, unit: "kg", source: "JET_JU_1983_Progress_Report.pdf", page: 13, confidence: table, note: "Table I: weight of iron core 2800 t. CONTRADICTION: Brochure p.6 and p.18 give 2700 t; 1979 AR p.15 gives 2567 t (= 1975 extended-performance total); Wesson p.42 gives 2600 t; 1975 basic 2263 t. Part masses (limbs, arms) not re-stated -> base part masses left unchanged, so they no longer sum to this total."}
  # ---------------- mechanical structure ----------------
  - {path: "structure.shell_description", value: "external shell of 8 identical sectors + upper/lower rings and collars in austenitic nodular (ductile) cast iron; inner cylinder stainless steel 304 with 32 flutes; octant joints by insulated shear keys", unit: "-", source: "JET_JU_Brochure.pdf", page: 17, confidence: table, note: "Table p.17: material for ring and external shell = austenitic nodular cast iron; inner cylinder = stainless steel 304; total ~470 t. Text p.16: inner cylinder with 32 flutes; shell split into 8 identical sectors. 1975 design: cast light alloy (Al) wedge blocks and Al-alloy plates - material changed; geometry of the shell not re-stated."}

components_remove:
  - {component: "limiters.n_rail_limiters", reason: "1975 set of 3 axisymmetric gas-cooled rail limiters replaced by 12 discrete modular limiters at the outer midplane (A modular limiter was chosen for the initial phases of JET operation).", source: "JET_JU_1983_Progress_Report.pdf", page: 24}
  - {component: "limiters.outer_limiter_plates", reason: "16 Mo plates of the outer rail limiter not built; see limiter_* modules.", source: "JET_JU_1983_Progress_Report.pdf", page: 24}
  - {component: "limiters.plate_size", reason: "1.00 x 0.60 x 0.01 m Mo plate replaced by 0.40 x 0.80 m (0.32 m2) modules.", source: "JET_Wesson_1999_Science_of_JET.pdf", page: 135}
  - {component: "limiters.plate_material", reason: "Mo replaced by graphite (4) and Ni-clad CuCr (8). Already in 1979 an actively cooled Inconel/Cu limiter system was defined (1979 AR p.35).", source: "JET_JU_1983_Progress_Report.pdf", page: 24}
  - {component: "limiters.upper_lower_rail_limiter_position", reason: "No upper/lower rail limiters in 1983; limiters only in the horizontal mid-plane at the outside wall. (Upper/lower toroidal belt limiters came later - designed 1983, p.39 - and are NOT part of this variant.)", source: "JET_JU_1983_Progress_Report.pdf", page: 24}
  - {component: "limiters.plate_orientation", reason: "Plate orientation assumption of the rail limiter no longer applies; module orientation given in limiter_* entries (40 cm wide, 80 cm high).", source: "JET_Wesson_1999_Science_of_JET.pdf", page: 135}
  - {component: "profiles/limiter_outer.csv", reason: "Assumed cross-section of the 1975 rail-limiter plate; the rail limiter was not built.", source: "JET_JU_1983_Progress_Report.pdf", page: 24}
  - {component: "nbi", reason: "No neutral injector was attached in 1983: eight PINI sources delivered, box pre-assembly started (p.17); the first NI box to be connected at Octant 8 in September 1984 (p.40). Only the Middle Port Adaptors (octants 4, 8) existed - see nbi_adaptor_*. The 1975 six-injector concept (whole section) is dropped for this variant.", source: "JET_JU_1983_Progress_Report.pdf", page: 40}

components_add:
  # ---------------- vacuum vessel ----------------
  - {component: "vessel_octant_layout_1983", type: "vessel_sector", params: {octant_angle_deg: 45.0, rigid_per_octant: 5, bellows_per_octant: 4, rigid_total: 40, bellows_total: 32, rigid_sector_types: 3, sequence_in_octant: ["R_end", "B", "R", "B", "R_mid_main_horizontal_port", "B", "R", "B", "R_end"], pitch_deg: 11.25, bellows_centres_deg_in_octant: [5.625, 16.875, 28.125, 39.375], main_horizontal_port_centre_deg_in_octant: 22.5, bellows_flanges: "parallel (constant toroidal length)", bellows_toroidal_length: 0.15, rigid_full_width_deg_at_R4389: 9.292, rigid_end_width_deg_at_R4389: 4.646, bellows_width_deg_at_R4389: 1.958, rigid_full_width_deg_at_R1664: 6.085, rigid_end_width_deg_at_R1664: 3.043, bellows_width_deg_at_R1664: 5.165, octant_k_phi_start_deg: "45*(k-1)", radial_tolerance_rigid: 0.003, poloidal_profile: "unchanged: jet1975 profiles/vessel_inner.csv, vessel_outer.csv", assumed_params: ["sequence_in_octant", "pitch_deg", "bellows_centres_deg_in_octant", "bellows_toroidal_length", "rigid_full_width_deg_at_R4389", "rigid_end_width_deg_at_R4389", "bellows_width_deg_at_R4389", "rigid_full_width_deg_at_R1664", "rigid_end_width_deg_at_R1664", "bellows_width_deg_at_R1664", "octant_k_phi_start_deg"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: assumed, note: "Counts (5 + 4, three rigid types, +-3 mm radial tolerance) are TEXT (p.24). Widths are NOT given anywhere -> ASSUMED layout: keep the 1975 pitch 360/32 = 11.25 deg with the bellows between TF-coil pitches; the octant ends are two half-width end sectors (the 1975 octant joint lay in the middle of the outermost rigid sectors, 1975 p.299), which explains 5 pieces = 4 pitch-equivalents and three sector types (end / intermediate / middle-with-main-port). Bellows have parallel flanges (1975 p.295, p.303) so their toroidal length is constant (0.15 m, see vessel_bellows_length_estimate) and the rigid sectors are wedges: widths in deg derived at the plasma-side wall radii 4.389 (outboard) and 1.664 (inboard). Alternative reading (5 equal sectors of ~(45 - 4*bellows)/5 deg) is possible but would break the 32-fold symmetry of the TF coils; not used. Octant numbering origin/direction is NOT known: octant k assumed to span phi = 45(k-1)..45k deg."}
  - {component: "vessel_bellows_1983", type: "vessel_bellows", params: {count_total: 32, per_octant: 4, layers: "inner + outer bellows welded to two perforated flanges", sheet_thickness: 0.002, convolution_height: 0.120, convolution_width: 0.010, flange_thickness: 0.004, flange_material: "Nicrofer 7216 LC", material: "Inconel 625", toroidal_length: 0.15, assumed_params: ["toroidal_length"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "Text: bellows from Inconel 625 sheets of 2 mm thickness with bellows convolutions of 120 mm and 10 mm width of convolution; assemblies = two perforated 4 mm Nicrofer 7216 LC flanges welded to an inner and an outer bellows. INTERPRETATION (ours): 120 mm = convolution height (depth), 10 mm = width of one convolution; number of convolutions not stated. toroidal_length from vessel_bellows_length_estimate (digitized on the 1975 plan) - ASSUMED unchanged in 1983. Protective bellows shields still present (Brochure p.12) -> base limiters.bellows_shield_Re/Ri kept."}
  - {component: "vessel_bellows_length_estimate", type: "vessel_bellows", params: {toroidal_length: 0.15, uncertainty: 0.03, measured_at: "inboard wall, near phi=0 of the plan", bellows_fraction_of_pitch_inboard: 0.42}, source: "JET_1975_Design_Proposal_EUR5516e.pdf", page: 313, confidence: digitized, note: "1975 Fig. IV.1-9 (plan of the torus midplane, 1 m scale bar = 586 px at 600 dpi): double bellows 90-100 px = 0.155-0.17 m, rigid wall boxes 120-145 px; the plan is schematic (box + bellows sum 0.38-0.41 m vs 0.30-0.33 m pitch arc at R 1.54-1.66), so fraction of pitch 0.42 x 0.32 m = 0.135 m and direct scale 0.16 m -> 0.15 +- 0.03 m. 1975 design value; 1983 bellows had dimensional changes (1979 AR p.36) of unknown size."}
  - {component: "vessel_restraint_rings", type: "vessel_restraint_ring", params: {count: 2, Z: [1.0, -1.0], construction: "up to 90 mm thick outer skins of the rigid sectors + electrically insulated bridges across the bellows", outer_skin_thickness_max: 0.090, side: "outboard", R_outer_skin_at_Z: 4.293, band_height_poloidal: 0.20, assumed_params: ["side", "band_height_poloidal"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "Text: modular restraint rings encircled the vessel, 1 m above and below the horizontal mid-plane, consisting of up to 90 mm thick outer skins of the rigid sectors and electrically insulated bridges across the bellows; they add toroidal rigidity. R_outer_skin_at_Z = 4.293 m DERIVED from jet1975 profiles/vessel_outer.csv at |Z| = 1.0. Which side (outboard assumed; inboard not excluded) and the poloidal band height (0.20 m) are ASSUMED."}
  - {component: "vessel_bake_operation_1983", type: "operating_parameter", params: {design_bake_C: 500, octant_oven_bake_C: 520, interspace_gas: "CO2", operated_1983_wall_C: 300, operated_1983_ports_C: 200, raised_bake_oct1983_C: 270}, source: "JET_JU_1983_Progress_Report.pdf", page: 39, confidence: text, note: "p.24: service at 500 C, each octant baked at 520 C in an oven; p.39: bake-out 300 C walls / 200 C ports (Oct-Dec 1983); p.13: bakeout raised to 270 C at start of 2nd campaign (Oct 1983); Brochure p.12: hot CO2 through the double-wall interspace, ports heated electrically. Base vessel.bake_temperature (500 C design) kept."}
  # ---------------- limiters: 12 modules at the outer midplane ----------------
  # Common facts: each unit 0.32 m2, horizontal mid-plane at the outside wall, radially adjustable (1983 PR p.24);
  # graphite = 40 cm wide x 80 cm high, slight toroidal curvature of the face (Wesson p.135) -> 0.40 x 0.80 = 0.32 m2 (consistent);
  # Ni: 1.5 mm Ni cladding on precipitation-hardened CuCr with fins, two-phase water cooling 6 bar, up to 1e7 W/m2 (p.24);
  # graphite modules uncooled, identical geometry (p.24). Jul-Nov 1983 only the 4 carbon limiters were used, Ni retracted 10 cm (p.39).
  # ASSUMED: toroidal positions (not stated anywhere): 12 evenly spaced at 30 deg, graphite at 0/90/180/270 deg;
  #          R_front graphite 4.21 (= base limiters.outer_limiter_R), Ni 4.31 (= graphite + 0.10 m retraction).
  - {component: "limiter_C1", type: "limiter_module", params: {material: "graphite", cooling: "none", phi_deg: 0.0, Z_center: 0.0, R_front: 4.21, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, face: "slight toroidal curvature", assumed_params: ["phi_deg", "R_front"]}, source: "JET_Wesson_1999_Science_of_JET.pdf", page: 135, confidence: text, note: "four graphite limiters, each 40 cm wide and 80 cm high, at the outer mid-plane (Wesson p.135); count 4 also 1983 PR p.24. phi and R_front ASSUMED."}
  - {component: "limiter_C2", type: "limiter_module", params: {material: "graphite", cooling: "none", phi_deg: 90.0, Z_center: 0.0, R_front: 4.21, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, face: "slight toroidal curvature", assumed_params: ["phi_deg", "R_front"]}, source: "JET_Wesson_1999_Science_of_JET.pdf", page: 135, confidence: text, note: "as limiter_C1; phi and R_front ASSUMED."}
  - {component: "limiter_C3", type: "limiter_module", params: {material: "graphite", cooling: "none", phi_deg: 180.0, Z_center: 0.0, R_front: 4.21, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, face: "slight toroidal curvature", assumed_params: ["phi_deg", "R_front"]}, source: "JET_Wesson_1999_Science_of_JET.pdf", page: 135, confidence: text, note: "as limiter_C1; phi and R_front ASSUMED."}
  - {component: "limiter_C4", type: "limiter_module", params: {material: "graphite", cooling: "none", phi_deg: 270.0, Z_center: 0.0, R_front: 4.21, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, face: "slight toroidal curvature", assumed_params: ["phi_deg", "R_front"]}, source: "JET_Wesson_1999_Science_of_JET.pdf", page: 135, confidence: text, note: "as limiter_C1; phi and R_front ASSUMED."}
  - {component: "limiter_Ni1", type: "limiter_module", params: {material: "Ni-clad (1.5 mm) CuCr", cooling: "water, two-phase, 6 bar (not cooled Jul-Nov 1983)", phi_deg: 30.0, Z_center: 0.0, R_front: 4.31, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, nickel_cladding: 0.0015, max_heat_flux_W_m2: 10000000.0, assumed_params: ["phi_deg", "R_front", "width_toroidal", "height_poloidal"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "eight nickel surface limiters installed (p.24), 0.32 m2 each, identical geometry to graphite ones (so 0.40 x 0.80 m by transfer from Wesson p.135 - ASSUMED); retracted 10 cm behind the carbon limiters and not water cooled during Jul-Nov 1983 (p.39); water leaks in 3 limiters, to be dismantled in 1984 (p.39). phi ASSUMED."}
  - {component: "limiter_Ni2", type: "limiter_module", params: {material: "Ni-clad (1.5 mm) CuCr", cooling: "water, two-phase, 6 bar (not cooled Jul-Nov 1983)", phi_deg: 60.0, Z_center: 0.0, R_front: 4.31, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, nickel_cladding: 0.0015, max_heat_flux_W_m2: 10000000.0, assumed_params: ["phi_deg", "R_front", "width_toroidal", "height_poloidal"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "as limiter_Ni1; phi ASSUMED."}
  - {component: "limiter_Ni3", type: "limiter_module", params: {material: "Ni-clad (1.5 mm) CuCr", cooling: "water, two-phase, 6 bar (not cooled Jul-Nov 1983)", phi_deg: 120.0, Z_center: 0.0, R_front: 4.31, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, nickel_cladding: 0.0015, max_heat_flux_W_m2: 10000000.0, assumed_params: ["phi_deg", "R_front", "width_toroidal", "height_poloidal"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "as limiter_Ni1; phi ASSUMED."}
  - {component: "limiter_Ni4", type: "limiter_module", params: {material: "Ni-clad (1.5 mm) CuCr", cooling: "water, two-phase, 6 bar (not cooled Jul-Nov 1983)", phi_deg: 150.0, Z_center: 0.0, R_front: 4.31, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, nickel_cladding: 0.0015, max_heat_flux_W_m2: 10000000.0, assumed_params: ["phi_deg", "R_front", "width_toroidal", "height_poloidal"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "as limiter_Ni1; phi ASSUMED."}
  - {component: "limiter_Ni5", type: "limiter_module", params: {material: "Ni-clad (1.5 mm) CuCr", cooling: "water, two-phase, 6 bar (not cooled Jul-Nov 1983)", phi_deg: 210.0, Z_center: 0.0, R_front: 4.31, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, nickel_cladding: 0.0015, max_heat_flux_W_m2: 10000000.0, assumed_params: ["phi_deg", "R_front", "width_toroidal", "height_poloidal"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "as limiter_Ni1; phi ASSUMED."}
  - {component: "limiter_Ni6", type: "limiter_module", params: {material: "Ni-clad (1.5 mm) CuCr", cooling: "water, two-phase, 6 bar (not cooled Jul-Nov 1983)", phi_deg: 240.0, Z_center: 0.0, R_front: 4.31, width_toroidal: 0.40, height_poloidal: 0.80, area: 0.32, nickel_cladding: 0.0015, max_heat_flux_W_m2: 10000000.0, assumed_params: ["phi_deg", "R_front", "width_toroidal", "height_poloidal"]}, source: "JET_JU_1983_Progress_Report.pdf", page: 24, confidence: text, note: "as limiter_Ni1; phi ASSUMED."}
