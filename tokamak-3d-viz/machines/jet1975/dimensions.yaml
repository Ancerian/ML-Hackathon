# JET as designed in 1975 — sourced dimension database (phase F1)
# Source: "The JET Project — Design Proposal for the Joint European Torus", EUR 5516e
#         (issued as EUR-JET-R5, Sept. 1975; reprinted with minor corrections March 1976), (c) CECA/CEE/CEEA 1976.
#         File: library/JET_1975_Design_Proposal_EUR5516e.pdf.  `page` = PDF page number (NOT the printed page number).
# Every value was read on the rendered page image (the OCR layer was used only to locate pages).
# Values in SI (m, m^2, m^3, kg, A, T, W, Pa-free units kept as noted). Notes quote the printed number exactly.
# confidence: text      = stated in running text
#             table     = read from a printed table
#             drawing   = printed dimension on a drawing
#             digitized = measured on a drawing/plot image with a stated calibration
#             assumed   = our assumption (no source value); see note
# derived: true = computed by us from sourced values (the arithmetic is in the note).
# Nothing here reproduces the figures; only facts/dimensions are extracted.

meta:
  machine: JET (design proposal 1975)
  source_id: JET1975
  source: "EUR 5516e (EUR-JET-R5), The JET Project - Design Proposal, CEC 1975/1976"
  page_convention: pdf_page
  units: SI
  coordinate_system: "cylindrical (R, phi, Z); Z=0 = equatorial plane (midplane); machine axis at R=0"

